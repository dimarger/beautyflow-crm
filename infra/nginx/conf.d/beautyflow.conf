upstream beautyflow_frontend {
  server frontend:3000;
  keepalive 32;
}

upstream beautyflow_backend {
  server backend:3001;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  limit_conn conn_per_ip 40;
  limit_req zone=global_per_ip burst=80 nodelay;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /_next/static/ {
    proxy_pass http://beautyflow_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?)$ {
    proxy_pass http://beautyflow_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
  }

  location = /api/v1/auth/login {
    limit_req zone=auth_per_ip burst=3 nodelay;
    proxy_pass http://beautyflow_backend/v1/auth/login;
    include /etc/nginx/conf.d/proxy-api.inc;
  }

  location ~ ^/api/v1/public-booking {
    limit_req zone=booking_per_ip burst=10 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://beautyflow_backend;
    include /etc/nginx/conf.d/proxy-api.inc;
  }

  location /api/ {
    limit_req zone=api_per_ip burst=40 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://beautyflow_backend;
    include /etc/nginx/conf.d/proxy-api.inc;
  }

  location / {
    proxy_pass http://beautyflow_frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
  }
}
